version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: hitechstore-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=hitechstore_v4
    command: mongod --wiredTigerCacheSizeGB 1

  app:
    build: .
    container_name: hitechstore-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/hitechstore_v4
      - JWT_SECRET=${JWT_SECRET:-hitechstore-production-secret-$(date +%s)}
      - JWT_EXPIRE=72h
      - FRONTEND_URL=http://localhost:3000
      - COMMISSION_RATE=15
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data: